# Сборка образа и деплой на прод. Запускается по успешному завершению workflow
# «CI» (ci.yml) для тех же веток — так деплой зависит от тестов того же
# коммита (`workflow_run.head_sha`), но живёт в своём прогоне, и отмена
# устаревших тестов в ci.yml его не задевает. Читается только из default-ветки
# (свойство workflow_run): правки этого файла действуют после мержа в master.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [ prod, docker, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # По workflow_run — только если CI того коммита прошёл (отменённый или
    # красный прогон деплоя не порождает). workflow_dispatch — ручной деплой
    # выбранного ref без ожидания CI.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    concurrency:
      # Начатый деплой не прерываем: следующий встаёт в очередь и выкатится
      # следом. cancel-in-progress: true здесь оборвал бы deploy.sh на середине.
      group: deploy-prod
      cancel-in-progress: false
    env:
      # Коммит, который прошёл CI, а не HEAD ветки на момент старта: между
      # ними мог появиться новый push, чьи тесты ещё не прошли.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          # latest — фолбэк/ручной up; тег по SHA — иммутабельный деплой и откат.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wishes-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wishes-app:${{ env.DEPLOY_SHA }}

      - name: Smoke test prod image
        # Поднимаем собранный prod-образ боевой командой gunicorn и проверяем,
        # что приложение стартует и отдаёт /health. Ловит поломки уровня образа
        # (нет системной либы, --no-dev убрал нужный пакет), которых не видит
        # джоба test, гоняющая код из исходников.
        run: |
          python3 - <<'PY'
          import json, subprocess
          key = subprocess.check_output(['openssl', 'genrsa', '2048'], stderr=subprocess.DEVNULL).decode()
          json.dump({
              'type': 'service_account', 'project_id': 'ci', 'private_key_id': 'd',
              'private_key': key, 'client_email': 'ci@ci.iam.gserviceaccount.com',
              'client_id': '0', 'auth_uri': 'https://accounts.google.com/o/oauth2/auth',
              'token_uri': 'https://oauth2.googleapis.com/token',
              'auth_provider_x509_cert_url': 'https://www.googleapis.com/oauth2/v1/certs',
              'client_x509_cert_url': 'https://example.com/x',
          }, open('/tmp/fb-smoke.json', 'w'))
          PY
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/wishes-app:${{ env.DEPLOY_SHA }}
          docker run -d --name smoke \
            -e SECRET_KEY=ci -e IS_DEBUG=false -e VK_SERVICE_KEY=ci -e VK_APP_ID=0 -e VK_WEB_APP_ID=0 \
            -e FIREBASE_KEY_PATH=/firebase.json -e TEST_TOKEN=t \
            -e MEDIA_ROOT=/tmp/media -e LOGS_DIR=/tmp/logs \
            -e DATABASE_URL=postgresql://x:x@127.0.0.1:5432/x \
            -v /tmp/fb-smoke.json:/firebase.json:ro \
            "$IMAGE" \
            uv run --no-sync gunicorn --bind 0.0.0.0:8000 \
              --worker-class uvicorn.workers.UvicornWorker --workers 1 --chdir /app app.main:app
          for i in $(seq 1 30); do
            if docker exec smoke python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)" 2>/dev/null; then
              echo "smoke OK (попытка $i)"; docker rm -f smoke >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "smoke FAILED"; docker logs smoke; docker rm -f smoke >/dev/null; exit 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Разворачиваем именно собранный образ по SHA, а не плавающий latest.
          # deploy.sh версионируется в репозитории; подтягиваем свежую копию
          # перед запуском.
          script: |
            cd /home/wishes/wishes
            git switch master
            git pull --ff-only
            bash deploy.sh ${{ env.DEPLOY_SHA }}
