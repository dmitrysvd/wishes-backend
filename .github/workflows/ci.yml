# Тесты и проверка миграций. Деплой — отдельный workflow (deploy.yml), который
# запускается по успешному завершению этого: так новый push может отменять
# устаревшие тесты, не трогая уже идущий деплой (отмена на уровне workflow
# убила бы и job деплоя в том же прогоне). Имя «CI» — ключ подписки
# deploy.yml (`workflow_run.workflows`): переименуешь — деплой перестанет
# запускаться.
name: CI

on:
  push:
    branches: [ prod, docker, master]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  # Новый push в ту же ветку (и в master) отменяет незавершённые тесты
  # предыдущего: результат устаревшего коммита никому не нужен, а деплоя в
  # этом workflow нет — отменять безопасно. Отменённый прогон не считается
  # успешным, поэтому deploy.yml по нему не стартует.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # ветка python-coverage-comment-action-data (данные бейджа)

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Обязательные настройки app/config.py. Значения фиктивные — нужны лишь
      # чтобы импорт приложения и тесты прошли в CI без прод-секретов.
      SECRET_KEY: ci-secret
      IS_DEBUG: 'true'
      VK_SERVICE_KEY: ci
      VK_APP_ID: '0'
      VK_WEB_APP_ID: '0'
      FIREBASE_KEY_PATH: /tmp/firebase-ci.json
      TEST_TOKEN: test_token
      MEDIA_ROOT: /tmp/media
      LOGS_DIR: /tmp/logs
      HEARTBEATS_DIR: /tmp/heartbeats
      DATABASE_URL: postgresql://ci:ci@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.17'

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare runtime dirs
        run: mkdir -p /tmp/media /tmp/logs

      - name: Generate dummy Firebase credentials
        # firebase_admin читает ключ на импорте app.firebase. Реальный секрет в
        # CI не нужен (сеть не дёргается), достаточно структурно валидного JSON.
        run: |
          python3 - <<'PY'
          import json, subprocess

          key = subprocess.check_output(['openssl', 'genrsa', '2048'], stderr=subprocess.DEVNULL).decode()
          json.dump({
              'type': 'service_account',
              'project_id': 'ci-dummy',
              'private_key_id': 'dummy',
              'private_key': key,
              'client_email': 'ci@ci-dummy.iam.gserviceaccount.com',
              'client_id': '0',
              'auth_uri': 'https://accounts.google.com/o/oauth2/auth',
              'token_uri': 'https://oauth2.googleapis.com/token',
              'auth_provider_x509_cert_url': 'https://www.googleapis.com/oauth2/v1/certs',
              'client_x509_cert_url': 'https://example.com/x',
          }, open('/tmp/firebase-ci.json', 'w'))
          PY

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests + coverage (100%)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=100

      - name: Coverage in job summary
        if: always()
        run: uv run coverage report --format=markdown --show-missing >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage badge data
        # Только push в master (в PR action писал бы комментарий — не нужен):
        # кладёт endpoint.json/badge.svg в ветку python-coverage-comment-action-data,
        # откуда бейдж в README берёт цифру.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 100
          MINIMUM_ORANGE: 90

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Обязательные настройки app/config.py. FIREBASE_KEY_PATH нужен лишь как
      # строка для валидации Settings — alembic импортит app.config/app.db, но
      # не app.firebase, файл не читается.
      SECRET_KEY: ci-secret
      IS_DEBUG: 'true'
      VK_SERVICE_KEY: ci
      VK_APP_ID: '0'
      VK_WEB_APP_ID: '0'
      FIREBASE_KEY_PATH: /tmp/firebase-ci.json
      TEST_TOKEN: test_token
      MEDIA_ROOT: /tmp/media
      LOGS_DIR: /tmp/logs
      HEARTBEATS_DIR: /tmp/heartbeats
      DATABASE_URL: postgresql://ci:ci@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.17'

      - name: Install dependencies
        run: uv sync --locked

      - name: Single alembic head
        # Две независимые головы (миграции из разных веток от одного down_revision)
        # сделали бы `alembic upgrade head` неоднозначным и уронили бы деплой —
        # ловим здесь, до него, с понятным сообщением.
        run: |
          heads="$(uv run alembic heads)"
          echo "$heads"
          count="$(echo "$heads" | grep -c '(head)' || true)"
          test "$count" -eq 1 || { echo "Множественные alembic-головы ($count) — нужен 'alembic merge heads'"; exit 1; }

      - name: Migrations apply from scratch
        # Прогон всей цепочки на чистой БД: ловит сломанную миграцию/битый
        # down_revision, чего тест-джоба на create_all не видела бы.
        run: uv run alembic upgrade head

      - name: No model/migration drift
        # `alembic check` падает, если модели разошлись с миграциями (напр.
        # поле/констрейнт есть в модели, но забыт в миграции — и наоборот).
        run: uv run alembic check
