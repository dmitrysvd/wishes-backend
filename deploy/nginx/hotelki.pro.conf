# nginx-конфиг для hotelki.pro — трекаемый источник правды.
# Применяется вручную на сервере (см. deploy/nginx/README.md). Не контейнеризован:
# nginx живёт на хосте, терминирует TLS (Certbot). Строки «managed by Certbot» —
# его, не трогаем.

# UA-детект краулеров соцсетей. Для них расшаренная ссылка /user отдаёт серверный
# OG-HTML с бэкенда (превью-карточка в чате); живые юзеры идут в Flutter SPA.
map $http_user_agent $is_social_crawler {
  default 0;
  '~*(Telegrambot|vkShare|vkontakte|facebookexternalhit|facebookcatalog|WhatsApp|Twitterbot|Discordbot|Slackbot|LinkedInBot|Pinterest|redditbot|Googlebot|Applebot|SkypeUriPreview|TelegramBot)' 1;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream app_server {
  server localhost:8000;
}

# Аналитический access-лог API (прибор возврата, короткое окно).
# `x_user_id` / `x_route` — метки, которые проставляет бэк в заголовках ответа
# (app/helpers/activity.py): без них в логе только сырой путь, где каждый UUID
# даёт свой бакет и ничего не агрегируется. Клиенту метки не уходят — их снимает
# proxy_hide_header ниже, а $upstream_http_* читает их до этого.
# `session_id` — необязательный заголовок ЗАПРОСА от клиента (X-Session-Id):
# если клиент его шлёт, сессии появляются без участия бэка.
# IP здесь намеренно нет: долгий retention этого лога не должен тянуть за собой
# хранение адресов. Ops-лог (access.log, combined, с IP) остаётся как был.
log_format json_analytics escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"user_id":"$upstream_http_x_user_id",'
    '"route":"$upstream_http_x_route",'
    '"session_id":"$http_x_session_id",'
    '"method":"$request_method",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"bytes":$body_bytes_sent,'
    '"ua":"$http_user_agent"'
  '}';

server {
  client_max_body_size 4G;
  include /etc/nginx/snippets/git-http.conf;
  server_name hotelki.pro;

  # Сжатие тяжёлых ассетов SPA (0021: main.dart.js ~4 МБ, canvaskit.wasm ~7 МБ).
  # Глобальный nginx.conf включает gzip только для text/html. Brotli-модуля в этой
  # сборке nginx нет — только gzip. gzip_static отдаёт заранее сжатый файл.gz,
  # если он лежит рядом (deploy_front.sh, см. README); без него — сжатие на лету.
  gzip_types application/javascript text/javascript application/json
             application/wasm text/css image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_static on;

  location /api/v1/ {
    # Лимит тела API: чуть выше UPLOAD_IMAGE_MAX_BYTES (10 МБ) приложения, чтобы
    # честный файл у границы отверг бэк JSON-ошибкой 413, а не nginx HTML-страницей.
    # 4G на уровне server остаётся для git-http.
    client_max_body_size 12m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_buffering off;

    # Второй лог помимо общего access.log: только API, JSON, без IP. Отдельный
    # каталог — чтобы logrotate дал ему свой retention (90 дней), не конфликтуя
    # с секцией /var/log/nginx/*.log. Каталог создаётся руками, см. README.
    access_log /var/log/nginx-analytics/analytics.log json_analytics;
    # Метки для лога — служебные, наружу не отдаём.
    proxy_hide_header X-User-Id;
    proxy_hide_header X-Route;

    proxy_pass http://app_server;
  }

  # вебсокеты
  location /api/v1/ws/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://app_server;
  }

  # OG-превью deep link'а вишлиста. Точный матч /user перехватывает оба класса
  # запросов; краулер → серверный OG-HTML с бэкенда (/og/user), живой юзер → SPA.
  # Идиома error_page+named-location (а не proxy_pass внутри if) — чтобы развилка
  # была надёжной. $is_args$args сохраняют ?userId=... из ссылки.
  location = /user {
    if ($is_social_crawler) {
      return 418;
    }
    error_page 418 = @og_preview;

    root /data/www;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location @og_preview {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://app_server/og/user$is_args$args;
  }

  # Firebase auth-handler (Google-вход из установленного PWA, 0019). В standalone
  # popup не возвращается в окно, поэтому signInWithRedirect с authDomain=hotelki.pro:
  # /__/auth/* должен отвечать Firebase, а не SPA-fallback (index.html). Без
  # proxy_ssl_server_name апстрим не подберёт сертификат по SNI; без переписи
  # cookie-домена браузер отбросит Set-Cookie с чужим Domain=. Query-string
  # (state, code) proxy_pass с URI-частью сохраняет.
  location /__/auth/ {
    proxy_pass https://hotelki-ec7c8.firebaseapp.com/__/auth/;
    proxy_set_header Host hotelki-ec7c8.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_cookie_domain hotelki-ec7c8.firebaseapp.com hotelki.pro;
    proxy_redirect off;
  }

  # flutter
  # Сборка Flutter web не хэширует имена файлов (main.dart.js, canvaskit/*.wasm,
  # assets/* лежат по фиксированным путям), а свой service worker выключен —
  # версионированных URL нет. Поэтому ВСЯ раздача SPA — no-cache: браузер хранит
  # файл, но перед использованием ревалидирует по ETag (304 дёшево). Без заголовка
  # Safari кэширует эвристически и установленное PWA залипает на старой версии
  # (в т.ч. на несовместимой паре main.dart.js ↔ canvaskit.wasm). Именно no-cache,
  # не no-store: no-store выкидывает и условные запросы, каждый запуск качает всё.
  # Когда фронт заведёт хэшированный/версионированный путь — см. блок immutable ниже.
  location / {
    alias /data/www/;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # .wasm: в mime.types nginx 1.18 типа нет, отдавалось application/octet-stream —
  # WebAssembly.instantiateStreaming такое отвергает, движок грузился медленным
  # путём. types внутри location замещает всю карту, поэтому тип задаём и явно.
  location ~* \.wasm$ {
    root /data/www;
    types { application/wasm wasm; }
    default_type application/wasm;
    add_header Cache-Control "no-cache";
  }

  # Долгий кэш для версионированных ассетов (0021). ВЫКЛЮЧЕН: в текущей сборке
  # версионированных путей нет; включать только для пути, который фронт объявит
  # хэшированным (напр. /v/<hash>/ или *.<hash>.js), иначе обновление залипнет.
  # location ~* ^/v/[0-9a-f]+/ {
  #   root /data/www;
  #   add_header Cache-Control "public, max-age=31536000, immutable";
  # }

  location /static {
    root /data;
  }

  location /media {
    root /data;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
  }

  location /.well-known {
    root /data;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/hotelki.pro/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/hotelki.pro/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = hotelki.pro) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  server_name hotelki.pro;
  listen 80;
  return 404; # managed by Certbot
}
