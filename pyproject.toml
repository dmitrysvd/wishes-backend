[project]
name = "wishes"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.52",
    "pydantic[email]>=2.13.5",
    "gunicorn>=26.2.0",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "alembic>=1.20.0",
    "firebase-admin>=7.5.0",
    "sqladmin[full]>=0.31.1",
    "loguru>=0.7.3",
    "beautifulsoup4>=4.15.0",
    "ipython>=9.17.1",
    "hawk-python-sdk>=3.5.2",
    "psycopg2-binary>=2.9.13",
    "apscheduler>=3.11.3",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ty>=0.0.80",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
]

[tool.uv]
# Кулдаун против supply-chain-атак: в резолв попадают только релизы старше
# 7 дней — скомпрометированную версию успевают снять с PyPI до того, как она
# окажется в uv.lock. Без этого `uv lock --upgrade` берёт релиз в день выхода.
exclude-newer = "7 days"

[tool.black]
skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "TID251"]
ignore = ["B008"]

# FCM доступен только через `app.firebase.send_push`: она пишет `PushSendingLog`,
# на котором держатся дедуп и метрика пушей. Прямой импорт — путь в обход лога.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"firebase_admin.messaging".msg = "Пуши только через app.firebase.send_push (пишет PushSendingLog)"

[tool.ruff.lint.per-file-ignores]
"app/firebase.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
# Пути в .coverage — относительные: отчёт читается и из другого корня (бейдж
# покрытия в CI строится в контейнере action, где репо смонтирован не в
# /home/runner/...). С абсолютными путями coverage падает «No source for code».
relative_files = true
# Админка (sqladmin) — декларативные ModelView, поведение задаёт библиотека;
# 100% покрытие требуем только для продуктового кода.
omit = ["app/admin/*"]
